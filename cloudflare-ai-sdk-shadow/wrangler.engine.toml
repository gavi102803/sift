"$schema" = "./node_modules/wrangler/config-schema.json"
name = "sift-ai-sdk-engine-staging"
main = "src/worker.ts"
compatibility_date = "2026-08-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
SIFT_SHADOW_ALLOWED_BASE_URLS = "https://api.openai.com/v1,https://api.anthropic.com,https://generativelanguage.googleapis.com/v1beta,https://api.deepseek.com/v1,https://openrouter.ai/api/v1,https://inference-api.nousresearch.com/v1,https://api.moonshot.ai/v1"

[observability]
enabled = true
