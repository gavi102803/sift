name: Live Provider Conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  live-conformance:
    name: Production Worker provider conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Worker conformance dependencies
        run: |
          python -m pip install -e .
          python -m pip install httpx
      - name: Run production Worker provider conformance
        env:
          SIFT_LIVE_PROVIDER: ${{ vars.SIFT_RUNTIME_PROVIDER }}
          SIFT_LIVE_BASE_URL: ${{ vars.SIFT_RUNTIME_BASE_URL }}
          SIFT_LIVE_MODEL: ${{ vars.SIFT_RUNTIME_MODEL }}
          SIFT_LIVE_API_KEY: ${{ secrets.SIFT_RUNTIME_API_KEY }}
        run: PYTHONPATH=.:src python -m verification.live_conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-live-conformance
          path: cloudflare/.data/live-conformance.json

  production-e2e:
    name: Managed production Harness E2E
    if: github.event_name == 'workflow_dispatch'
    needs: live-conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production E2E dependencies
        run: |
          python -m pip install -e .
          python -m pip install httpx
      - name: Run Managed production Harness E2E
        env:
          SIFT_E2E_BASE_URL: ${{ vars.SIFT_PRODUCTION_BASE_URL }}
          SIFT_E2E_INSTALLATION_ID: ${{ vars.SIFT_E2E_INSTALLATION_ID }}
          SIFT_E2E_SESSION_TOKEN: ${{ secrets.SIFT_E2E_SESSION_TOKEN }}
          SIFT_E2E_PROVIDER: ${{ vars.SIFT_RUNTIME_PROVIDER }}
          SIFT_E2E_PROVIDER_BASE_URL: ${{ vars.SIFT_RUNTIME_BASE_URL }}
          SIFT_E2E_MODEL: ${{ vars.SIFT_RUNTIME_MODEL }}
          SIFT_E2E_PROVIDER_API_KEY: ${{ secrets.SIFT_RUNTIME_API_KEY }}
        run: PYTHONPATH=.:src python -m verification.production_e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-harness-e2e
          path: cloudflare/.data/production-e2e.json
