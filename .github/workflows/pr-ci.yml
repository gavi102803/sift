name: PR CI

on:
  pull_request:
  push:
    branches:
      - codex/**

jobs:
  backend:
    name: Personal Companion compatibility (non-production)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sift
          POSTGRES_PASSWORD: sift-test
          POSTGRES_DB: sift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sift -d sift_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e backend
      - name: Backend gate
        env:
          SIFT_ENV: test
          SIFT_PROVIDER_SETTINGS_PATH: ${{ runner.temp }}/provider-settings.json
          SIFT_CAPABILITY_PROBE_CACHE_PATH: ${{ runner.temp }}/capability-probes.json
          SIFT_TEST_POSTGRES_URL: postgresql+psycopg://sift:sift-test@127.0.0.1:5432/sift_test
        run: scripts/check.sh backend

  worker:
    name: Production Worker lint, tests, migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Worker test dependencies
        run: |
          python -m pip install -e cloudflare
          python -m pip install httpx pytest pytest-asyncio ruff
      - name: Production Worker gate
        run: scripts/check.sh worker

  ai-sdk-shadow:
    name: AI SDK shadow contract and Worker bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-ai-sdk-shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: cloudflare-ai-sdk-shadow/pnpm-lock.yaml
      - name: Install shadow dependencies
        run: pnpm install --frozen-lockfile
      - name: Shadow contract and bundle gate
        run: pnpm run check

  ios:
    name: iOS build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Sift
        run: scripts/check.sh ios
